<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рулетка спидрана</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b2a4a;--bg2:#061528;--cy:#4df0ff;--tx:#fff;--card:#12365e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2));color:var(--tx);font-family:'Press Start 2P',monospace,sans-serif;text-align:center;padding:20px 12px 40px}
h1{font-size:clamp(22px,7vw,48px);margin:10px 0 6px;line-height:1.2;text-shadow:0 4px 0 #1b6a8a,0 0 24px var(--cy)}
.sub{font-size:10px;color:#9fd8ee;margin-bottom:22px;line-height:1.6}
.steps{display:flex;justify-content:center;gap:8px;margin-bottom:16px;font-size:9px}
.step{padding:8px 10px;border:2px solid #2a5d86;color:#6c9bb8}
.step.on{border-color:var(--cy);color:#fff;box-shadow:0 0 14px var(--cy)}
.step.done{border-color:#4dff8a;color:#4dff8a}
.frame{position:relative;border:4px solid var(--cy);border-radius:18px;box-shadow:0 0 28px var(--cy),inset 0 0 22px rgba(77,240,255,.4);overflow:hidden;max-width:900px;margin:0 auto;background:rgba(5,20,40,.6);padding:14px 0}
.strip{display:flex;gap:10px;will-change:transform}
.c{flex:0 0 130px;height:130px;background:var(--card);border:3px solid #2a6a9a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:9px;line-height:1.4;padding:6px}
.c img{width:64px;height:64px;image-rendering:pixelated}.c span{word-break:break-word}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 12px #fff;transform:translateX(-50%);z-index:2}
.stagename{font-size:14px;margin:0 0 12px;color:var(--cy)}
button{font-family:inherit;font-size:13px;color:#fff;background:#1fa7c9;border:4px solid #fff;padding:16px 22px;margin:22px 6px 0;cursor:pointer;box-shadow:0 6px 0 #0d5a73;max-width:100%}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0d5a73}
button:disabled{opacity:.5;cursor:default}
button.alt{background:#2c4a66;font-size:10px}
.res{max-width:900px;margin:26px auto 0;border:4px solid var(--cy);border-radius:18px;padding:18px;box-shadow:0 0 24px var(--cy);background:rgba(5,20,40,.7);display:none;text-align:left}
.res h2{font-size:14px;text-align:center;margin:0 0 16px;color:var(--cy)}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--card);border:3px solid #2a6a9a;font-size:11px;line-height:1.5}
.row small{display:block;font-size:8px;color:#8cc4de;margin-bottom:4px}
.row img{width:56px;height:56px;flex:none;image-rendering:pixelated}
.opt{margin-top:18px;font-size:9px;color:#9fd8ee;line-height:1.8}
.opt input{width:16px;height:16px;vertical-align:middle;accent-color:#4df0ff}
.task{font-size:10px;line-height:1.8;text-align:center;margin-top:12px;color:#ffe27a}
:root{--t1:#3b82f6;--t2:#22c9a0;--t3:#c8e63c;--t6:#ffcc00;--t4:#fb923c;--t5:#ef4444;}
.c.t1{border-color:var(--t1);box-shadow:0 0 10px var(--t1),inset 0 -14px 16px -8px var(--t1)}.row.t1{border-color:var(--t1);box-shadow:0 0 10px var(--t1)}.badge.t1{background:var(--t1)}.chip.t1{border-color:var(--t1);color:var(--t1)}
.c.t2{border-color:var(--t2);box-shadow:0 0 10px var(--t2),inset 0 -14px 16px -8px var(--t2)}.row.t2{border-color:var(--t2);box-shadow:0 0 10px var(--t2)}.badge.t2{background:var(--t2)}.chip.t2{border-color:var(--t2);color:var(--t2)}
.c.t3{border-color:var(--t3);box-shadow:0 0 10px var(--t3),inset 0 -14px 16px -8px var(--t3)}.row.t3{border-color:var(--t3);box-shadow:0 0 10px var(--t3)}.badge.t3{background:var(--t3)}.chip.t3{border-color:var(--t3);color:var(--t3)}
.c.t4{border-color:var(--t4);box-shadow:0 0 10px var(--t4),inset 0 -14px 16px -8px var(--t4)}.row.t4{border-color:var(--t4);box-shadow:0 0 10px var(--t4)}.badge.t4{background:var(--t4)}.chip.t4{border-color:var(--t4);color:var(--t4)}
.c.t5{border-color:var(--t5);box-shadow:0 0 10px var(--t5),inset 0 -14px 16px -8px var(--t5)}.row.t5{border-color:var(--t5);box-shadow:0 0 10px var(--t5)}.badge.t5{background:var(--t5)}.chip.t5{border-color:var(--t5);color:var(--t5)}
.badge{display:inline-block;font-size:8px;padding:5px 7px;margin-top:8px;color:#000}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 auto 14px;max-width:900px}
.chip{font-size:8px;padding:6px 8px;border:2px solid;background:rgba(0,0,0,.3)}
.c.t6{border-color:var(--t6);animation:gl 1.4s ease-in-out infinite alternate;background:linear-gradient(160deg,#5a4300,#12365e 60%)}
.row.t6{border-color:var(--t6);animation:gl 1.4s ease-in-out infinite alternate}
.badge.t6{background:linear-gradient(90deg,#ffcc00,#fff2a8,#ffcc00)}.chip.t6{border-color:var(--t6);color:var(--t6);box-shadow:0 0 10px var(--t6)}
@keyframes gl{from{box-shadow:0 0 8px var(--t6),inset 0 -14px 16px -8px var(--t6)}to{box-shadow:0 0 22px var(--t6),inset 0 -14px 22px -4px var(--t6)}}
</style>
</head>
<body>
<h1>РУЛЕТКА<br>СПИДРАНА</h1>
<div class="sub">Предмет → Моб → Измерение. Крути и проходи!</div>
<div class="steps"><div class="step on" id="s0">1 ПРЕДМЕТ</div><div class="step" id="s1">2 МОБ</div><div class="step" id="s2">3 МИР</div></div>
<div class="stagename" id="sn">ПРЕДМЕТЫ</div>
<div class="frame"><div class="ptr"></div><div class="strip" id="strip"></div></div>
<button id="go">КРУТИТЬ!</button>
<div class="opt"><label><input type="checkbox" id="end"> добавить Энд в рулетку миров</label></div>

<div class="res" id="res">
  <h2>ТВОИ РЕЗУЛЬТАТЫ</h2>
  <div id="rows"></div>
  <div class="task" id="task"></div>
  <div style="text-align:center"><button class="alt" id="copy">КОПИРОВАТЬ</button><button class="alt" id="again">ЗАНОВО</button></div>
</div>

    go.textContent="КРУТИТЬ: "+STAGES[step].t.toUpperCase();
  }else{
    go.style.display="none";document.getElementById("sn").textContent="ГОТОВО!";showRes();
  }
}
function showRes(){
  document.getElementById("rows").innerHTML=results.map(r=>`<div class="row t${r.v[2]}"><img src="${src(r.v)}" alt=""><div><small>${r.t.toUpperCase()}</small>${r.v[0]}<br><span class="badge t${r.v[2]}">${LV[r.v[2]-1]}</span></div></div>`).join("");
  document.getElementById("task").textContent=`Задание: ты превращаешься в моба «${results[1].v[0]}», возрождаешься в измерении «${results[2].v[0]}» и спидранишь предмет «${results[0].v[0]}»!`;
  const r=document.getElementById("res");r.style.display="block";r.scrollIntoView({behavior:"smooth"});
}
function reset(){
  step=0;results=[];strip.innerHTML="";strip.style.transform="none";
  [0,1,2].forEach(i=>document.getElementById("s"+i).className="step"+(i?"":" on"));
  document.getElementById("sn").textContent="ПРЕДМЕТЫ";
  document.getElementById("res").style.display="none";go.style.display="";go.textContent="КРУТИТЬ!";window.scrollTo({top:0,behavior:"smooth"});
}
go.onclick=spin;
document.getElementById("again").onclick=reset;
document.getElementById("copy").onclick=async()=>{
  const txt=document.getElementById("task").textContent;
  try{await navigator.clipboard.writeText(txt);document.getElementById("copy").textContent="СКОПИРОВАНО!"}catch(e){document.getElementById("copy").textContent="НЕ ВЫШЛО"}
  setTimeout(()=>document.getElementById("copy").textContent="КОПИРОВАТЬ",1500);
};
</script>
</body>
</html>
